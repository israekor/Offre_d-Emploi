server {
    listen 80;
    server_name localhost;

    # Serve static files from the build directory
    location / {
        root /usr/share/nginx/html;
        
        # Try to serve the requested file, if not found serve index.html
        # This allows React Router to handle all routes on the client side
        try_files $uri $uri/ /index.html;
        
        # Cache busting for static assets
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
    }

    # Disable caching for index.html to ensure latest version is served
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Optional: serve with gzip compression
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json;
    gzip_min_length 1024;
}
